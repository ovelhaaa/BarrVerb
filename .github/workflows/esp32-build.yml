name: ESP32 Build

on:
  push:
    branches: [main]
    paths:
      - 'esp32_barrverb/**'
      - '.github/workflows/esp32-build.yml'
  pull_request:
    paths:
      - 'esp32_barrverb/**'
      - '.github/workflows/esp32-build.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-esp32:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: esp32_barrverb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e lolin32_lite

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware-lolin32-lite
          path: esp32_barrverb/.pio/build/lolin32_lite/firmware.bin
          if-no-files-found: error
